<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <circle cx="200" cy="200" r="200" fill="#0a0a0a"/>
  <!-- Golden spires / skyline mark -->
  <g stroke="#c9a84c" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="175" x2="120" y2="130"/>
    <line x1="145" y1="175" x2="145" y2="95"/>
    <line x1="170" y1="175" x2="170" y2="70"/>
    <line x1="200" y1="175" x2="200" y2="45"/>
    <line x1="230" y1="175" x2="230" y2="70"/>
    <line x1="255" y1="175" x2="255" y2="95"/>
    <line x1="280" y1="175" x2="280" y2="130"/>
  </g>
  <!-- Base horizon line -->
  <line x1="70" y1="178" x2="330" y2="178" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- IZUMI wordmark -->
  <text x="200" y="245" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="600" letter-spacing="0.35em" fill="#c9a84c">IZUMI</text>
  <!-- Subtitle -->
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" letter-spacing="0.35em" fill="#e8e4dc">RESTAURANT & LOUNGE</text>
</svg>
